name: publish-npm

# Publishes @mnmal-ai/holomap-clusterer to npmjs.com via npm trusted
# publishing (OIDC). No long-lived token exists anywhere: the registry trusts
# this repo + this filename + the `release` environment, which is why neither
# name may change without re-registering the trusted publisher on npmjs.
#
# SEPARATE from publish.yml, which owns the crates.io release of the `holomap`
# crate. The two artifacts version independently — read the current numbers
# from Cargo.toml and npm/package.json, never from prose like this comment,
# which has no check over it and has drifted before — so one trigger cannot
# serve both without guessing which version a release commit meant.
#
# TRIGGER: a merge to main whose commit subject starts with `release: npm v`.
# The crate's workflow fires on `release: v`, and the two are mutually
# exclusive because "release: n..." never matches "release: v". House
# convention otherwise unchanged: ride a `release/npm-vX.Y.Z` branch, bump the
# version in npm/package.json on it, set the merge commit subject explicitly,
# and let this workflow own the tag. DO NOT tag by hand.
#
# TAG: `holomap-clusterer-vX.Y.Z`, deliberately not `vX.Y.Z` — that namespace
# belongs to the crate and is already populated. `git tag` is the authority on
# what is taken; an npm release tagged `vX.Y.Z` would collide with the crate's
# releases, and the two version lines are unrelated, so a collision is likely
# rather than hypothetical.
#
# npmjs side (one-time, web UI): package Settings → Trusted Publisher → GitHub Actions
#   Organization or user: mnmal-ai
#   Repository:           holomap
#   Workflow filename:    publish-npm.yml
#   Environment:          release

on:
  push:
    branches: [main]
  # Manual retry path. Without this, a publish that fails AFTER the release
  # commit has already landed on main — a transient registry error, or the
  # missing-wasm bug that broke the first attempt — can only be retried by
  # inventing a second commit with the same `release: npm v` subject, which
  # pollutes history to work around a workflow limitation. Re-running is safe:
  # the gates and the already-published guard run identically on this path.
  workflow_dispatch:

permissions: {}

# Never cancel: a run cut short between the npm publish and the tag leaves a
# release half-done.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that runs repo or dependency code happens here, with a
  # read-only token and no OIDC: cargo, wasm-bindgen, pnpm install and the
  # test suites never sit beside a credential that can publish or push.
  verify:
    # `github.event.head_commit` does not exist on a workflow_dispatch event,
    # so the subject check must be short-circuited rather than merely relied on
    # to be false — otherwise every manual run silently skips the job.
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: npm v')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      # workflow_dispatch can name any branch; only main releases.
      - name: Refuse anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::publishing runs only from refs/heads/main, not $GITHUB_REF"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-06-07
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # prepack runs scripts/build-wasm.sh, which does
          # `cargo install wasm-bindgen-cli --locked` and would otherwise
          # rebuild the CLI from source on every release.
          key: wasm-bindgen-cli

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { version: 12.14.0 }

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          node-version: 22

      # Green-gate before anything irreversible. A publish cannot be undone —
      # npmjs never lets a version number be reused, even after unpublish — so
      # every gate runs first, exactly as publish.yml does for the crate.
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

      - name: Build the native binary for the subprocess backend
        run: cargo build --release -p holomap-clusterer

      # Required BEFORE the npm suite, not merely before publishing. `pretest`
      # refuses to run without npm/wasm/, which is gitignored build output, and
      # `prepack` — which builds it during `pnpm publish` — happens later. The
      # first release attempt failed exactly here. prepack still rebuilds it at
      # publish time, which is the guarantee that the shipped artifact comes
      # from the release commit; this step is what lets the gate run at all.
      - name: Build wasm
        run: bash scripts/build-wasm.sh

      - name: npm suite
        working-directory: npm
        run: pnpm install --frozen-lockfile && pnpm check-types && pnpm test

      # The version reaches a git tag and a registry coordinate, so it is
      # validated as strict semver before it is allowed anywhere. package.json
      # is repo-controlled and needs a PR to change, but an unvalidated value
      # flowing into GITHUB_OUTPUT and then into `git tag` is the shape of a
      # real injection even when this particular source is trusted.
      - name: Resolve package version
        id: ver
        working-directory: npm
        run: |
          # shellcheck disable=SC2016 # the $ signs are JavaScript, not shell
          node -e '
            const v = require("./package.json").version;
            // Anchored to the WHOLE string. A shell `grep -Ex` was tried here
            // and is wrong: -x matches a LINE, so a version containing a
            // newline passes the check and then injects a second key into
            // GITHUB_OUTPUT. JavaScript $ (without /m) does not admit even a
            // trailing newline, and doing it in node keeps the value out of
            // the shell entirely.
            if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(v)) {
              console.error(`refusing to publish: version ${JSON.stringify(v)} is not strict semver`);
              process.exit(1);
            }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `version=${v}\n`);
            console.log(`Resolved version: ${v}`);
          '

      # `pnpm pack` runs `prepack` (build:wasm && build), so dist/ and wasm/
      # are produced from this exact commit rather than from whatever a
      # developer happened to have on disk. Both are gitignored for that
      # reason. The package has no workspace:/catalog: refs, so nothing needs
      # rewriting; the tarball is the final artifact.
      - name: Pack
        working-directory: npm
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP/pkg"
          got=$(for t in "$RUNNER_TEMP"/pkg/*.tgz; do tar -xOzf "$t" package/package.json | jq -r '.name + "@" + .version'; done | xargs)
          if [ "$got" != "@mnmal-ai/holomap-clusterer@$VERSION" ]; then
            echo "::error::packed '$got', expected '@mnmal-ai/holomap-clusterer@$VERSION'"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Holds the OIDC token and nothing else: no checkout, no install, no repo
  # code. It publishes the tarballs verify built, byte for byte.
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.ref == 'refs/heads/main'
    environment: release
    permissions:
      id-token: write # npm trusted publishing (OIDC); provenance comes with it
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/pkg

      # npm >= 11.5.1 does the OIDC exchange itself; Node 22 is above the
      # 22.14.0 trusted publishing needs.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      # Idempotent: a version already on npmjs is skipped, so a re-run after a
      # partial failure publishes only what is missing. Only a clear 404 means
      # unpublished; any other answer stops the job rather than guess. A
      # prerelease goes to `next` so it never becomes what a bare install
      # resolves.
      - name: Publish to npm
        run: |
          for tgz in "$RUNNER_TEMP"/pkg/*.tgz; do
            manifest=$(tar -xOzf "$tgz" package/package.json)
            name=$(jq -r .name <<< "$manifest")
            version=$(jq -r .version <<< "$manifest")
            if ! [[ $name =~ ^@mnmal-ai/[a-z0-9-]+$ && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$tgz carries an unexpected name or version"
              exit 1
            fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "https://registry.npmjs.org/${name/\//%2f}/$version") || true
            case "$code" in
              200) echo "$name@$version is already on npmjs — skipping"; continue ;;
              404) ;;
              *) echo "::error::registry lookup for $name@$version answered '$code'"; exit 1 ;;
            esac
            case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
            npx --yes npm@11.21.0 publish "$tgz" --access public --tag "$tag" --ignore-scripts
          done

  release:
    runs-on: ubuntu-latest
    needs: [verify, publish]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # tag + push the release tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # publish skips a version npmjs already has, so a release commit that
      # forgot to bump npm/package.json would otherwise go green having shipped
      # nothing. A tag on another commit is that case; a tag on this one is a
      # re-run, and is left alone.
      - name: Tag the release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          TAG="holomap-clusterer-v${VERSION}"
          tagged=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -1 | cut -f1)
          if [ "$tagged" = "$GITHUB_SHA" ]; then
            echo "$TAG already tags this commit — nothing to do"
            exit 0
          elif [ -n "$tagged" ]; then
            echo "::error::$TAG already tags $tagged — bump the version in npm/package.json"
            exit 1
          fi
          # annotated tags need a committer identity, which the runner lacks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "@mnmal-ai/holomap-clusterer v${VERSION}"
          git push origin "$TAG"
