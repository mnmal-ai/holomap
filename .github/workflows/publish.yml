name: publish

# Trusted Publishing to crates.io via OIDC — no long-lived token.
#
# House convention (mirrors AgentRule #16): a release rides a `release/vX.Y.Z`
# branch whose merge commit subject starts with `release: v`. Bump the version
# in Cargo.toml on that branch; on merge this workflow publishes the crate,
# then tags `vX.Y.Z` on the merge commit and pushes it. DO NOT tag manually —
# the workflow owns the tag.
#
# crates.io side (one-time, web UI): crate Settings → Trusted Publishing → add
#   Repository owner: mnmal-ai
#   Repository name:  holomap
#   Workflow filename: publish.yml
#   Environment:       release

on:
  push:
    branches: [main]

permissions:
  contents: write   # tag + push the release tag
  id-token: write   # OIDC token exchange for crates.io

jobs:
  publish:
    # only on a release merge commit
    if: "startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-06-07

      # green-gate before anything irreversible
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

      # Selected BY NAME, not packages[0]. This is a workspace with two
      # published crates, and `cargo metadata` makes no ordering guarantee.
      # It happens to list holomap first today only because cargo sorts
      # alphabetically and "holomap" < "holomap-clusterer" — a coincidence
      # that a third member sorting ahead of it would silently end.
      #
      # What that would actually cost, stated accurately because the obvious
      # guess is worse than the truth: `cargo publish` below takes no -p and
      # publishes the ROOT package from its own manifest, so a mis-resolved
      # version can never publish the wrong crate or the wrong version. The
      # damage is a correctly-published release carrying a MISLABELLED tag —
      # and, where the bad version collides with an existing tag, a clean
      # failure at the re-tag guard, which runs before publish rather than
      # after. Bad, recoverable, and worth removing.
      #
      # Validation and the GITHUB_OUTPUT write both happen in python, so the
      # version never passes through the shell. A version carrying a newline
      # would otherwise append a second key to GITHUB_OUTPUT; the anchored
      # fullmatch cannot be satisfied by a multi-line string. Mirrors
      # publish-clusterer-crate.yml, which got this treatment first.
      - name: Resolve crate version
        id: ver
        run: |
          cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, os, re, sys
          pkgs = json.load(sys.stdin)["packages"]
          v = next(p["version"] for p in pkgs if p["name"] == "holomap")
          if not re.fullmatch(r"\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?", v):
              sys.exit(f"refusing to publish: version {v!r} is not strict semver")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={v}\n")
          print(f"Resolved version: {v}")
          '

      - name: Guard against re-tagging
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists — nothing to do"
            exit 1
          fi

      - name: Authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Tag the release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # annotated tags need a committer identity, which the runner lacks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "holomap v${VERSION}"
          git push origin "v${VERSION}"
