name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-06-07
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Cross-platform: same-platform bit-identity must hold on every OS (the
  # in-suite double-run gate checks it per platform), and the structural
  # quality gates back the README's "cross-platform structurally identical"
  # claim with evidence rather than assertion. fail-fast off so one platform's
  # result never hides another's.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-06-07
      - run: cargo test --workspace --all-features

  # The reason this crate exists. Runs the suite twice on the reference
  # platform — the in-process determinism gate plus a second invocation for
  # cross-process byte-stability.
  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-06-07
      - run: cargo test --all-features
      - run: cargo test --all-features

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable as of 2026-06-07
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # scripts/build-wasm.sh runs `cargo install wasm-bindgen-cli --locked`,
          # which otherwise recompiles the CLI from source on every single run.
          key: wasm-bindgen-cli
      - name: Build wasm
        run: bash scripts/build-wasm.sh
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { version: 10 }
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5.0.0
        with: { node-version: 22 }
      - name: Build the native binary for the subprocess backend
        run: cargo build --release -p holomap-clusterer
      - name: npm suite
        working-directory: npm
        run: pnpm install --frozen-lockfile && pnpm check-types && pnpm test
